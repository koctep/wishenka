<!DOCTYPE html>
<html lang="{{ locale|default('en') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wishenka{% endblock %}</title>
    <link rel="stylesheet" href="/static/miniapp.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/json-enc.js"></script>
    <script src="/static/app.js" defer></script>
    <script src="/static/wishlist.js" defer></script>
    <script src="/static/receipt.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900"
      data-i18n-prepare-error="{{ t('web.common.request_prepare_error', locale|default('en')) }}"
      data-i18n-busy-error="{{ t('web.common.wish_busy_error', locale|default('en')) }}"
      data-i18n-receipt-failure="{{ t('web.receipt.generic_failure', locale|default('en')) }}"
      data-i18n-receipt-summary="{{ t('web.receipt.summary_template', locale|default('en'), chosen='{chosen}', remaining='{remaining}') }}"
      data-i18n-item-unavailable="{{ t('web.item.unavailable', locale|default('en')) }}"
      data-i18n-list-changed="{{ t('web.wishlist.list_changed', locale|default('en')) }}"
      {% if viewer_identified|default(false) %}data-viewer-identified="true"{% endif %}>
    {% if viewer_identified|default(false) %}
    <nav class="top-nav container mx-auto px-4 pt-3 max-w-lg">
        <a href="/settings" class="settings-link">{{ t('nav.settings', locale|default('en')) }}</a>
    </nav>
    {% endif %}
    <main class="container mx-auto px-4 py-6 max-w-lg">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
