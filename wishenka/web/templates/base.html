<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wishenka{% endblock %}</title>
    <link rel="stylesheet" href="/static/miniapp.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/json-enc.js"></script>
    <script src="/static/wishlist.js" defer></script>
    <script src="/static/receipt.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        if (!document.body.hasAttribute('data-viewer-identified')) { return; }
        var csrfToken = '';
        fetch('/api/auth/csrf', { credentials: 'same-origin' })
            .then(function (response) { return response.ok ? response.json() : {}; })
            .then(function (body) { csrfToken = (body && body.csrf_token) || ''; })
            .catch(function () { csrfToken = ''; });
        document.addEventListener('htmx:configRequest', function (evt) {
            var verb = String((evt.detail && evt.detail.verb) || '').toUpperCase();
            if (verb === 'GET' || verb === 'HEAD' || verb === 'OPTIONS' || !csrfToken) { return; }
            evt.detail.headers['X-CSRF-Token'] = csrfToken;
        });
    });
    function reservationRequestPath(elt) {
        var node = elt;
        while (node && node.getAttribute) {
            var path = node.getAttribute('hx-post') || node.getAttribute('hx-patch');
            if (path && path.indexOf('/reservations') !== -1) { return path; }
            node = node.parentElement;
        }
        return '';
    }
    function swapWishCard(card, markup) {
        var summary = card.querySelector('.item-card-summary');
        var wasExpanded = summary.getAttribute('aria-expanded');
        var cardId = card.id;
        card.outerHTML = markup;
        var nextCard = document.getElementById(cardId);
        if (!nextCard) { return; }
        if (wasExpanded === 'true') {
            var nextSummary = nextCard.querySelector('.item-card-summary');
            var nextDetails = nextCard.querySelector('.item-card-details');
            if (nextSummary) { nextSummary.setAttribute('aria-expanded', 'true'); }
            if (nextDetails) { nextDetails.hidden = false; }
        }
    }
    document.addEventListener('htmx:afterRequest', function (evt) {
        var elt = evt.detail.elt;
        if (!reservationRequestPath(elt)) { return; }
        var row = elt.closest ? elt.closest('.reservation-row') : null;
        if (row) {
            var rowXhr = evt.detail.xhr;
            var rowStatus = rowXhr ? rowXhr.status : 0;
            var busySlot = row.querySelector('[data-reservation-busy]');
            var busyText =
                'Желание занято, бронь не изменилась. Повторите попытку.';
            if (rowStatus === 503) {
                if (busySlot) {
                    busySlot.hidden = false;
                    busySlot.textContent = busyText;
                }
                return;
            }
            var notice = '';
            if (rowStatus === 409) {
                var detail = rowXhr.responseText || '';
                notice = detail.indexOf('available') === -1 ? 'refused' : 'shortage';
            } else if (rowStatus === 401 || rowStatus === 403 || rowStatus === 404) {
                notice = 'refused';
            } else if (rowStatus !== 200 && rowStatus !== 201) {
                return;
            }
            var listUrl = '/web/reservations/list';
            if (notice) {
                listUrl += '?notice=' + notice;
                var reservationId = row.getAttribute('data-reservation-id');
                if (notice === 'shortage' && reservationId) {
                    listUrl += '&reservation_id=' + encodeURIComponent(reservationId);
                }
            }
            fetch(listUrl, {
                credentials: 'same-origin',
                headers: {'Accept': 'text/html'}
            }).then(function (response) { return response.text(); })
                .then(function (markup) {
                    var cabinet = document.getElementById('reservations-cabinet');
                    if (!cabinet) { return; }
                    cabinet.outerHTML = markup;
                    var next = document.getElementById('reservations-cabinet');
                    if (next && window.htmx) { window.htmx.process(next); }
                });
            return;
        }
        var card = elt.closest ? elt.closest('.item-card') : null;
        if (!card) { return; }
        var xhr = evt.detail.xhr;
        var status = xhr ? xhr.status : 0;
        if (status === 503) {
            var busy = card.querySelector('[data-giver-busy]');
            if (busy) {
                busy.hidden = false;
                busy.textContent = 'Желание занято, бронь не изменилась. Повторите попытку.';
            }
            return;
        }
        var notice = '';
        if (status === 409) {
            var detail = xhr.responseText || '';
            notice = detail.indexOf('available') === -1 ? 'refused' : 'shortage';
        } else if (status === 401 || status === 403 || status === 404) {
            notice = 'refused';
        } else if (status !== 200 && status !== 201) {
            return;
        }
        var wishlistId = card.getAttribute('data-wishlist-id');
        var itemId = card.getAttribute('data-item-id');
        var isFirst = card.getAttribute('data-is-first') === 'true';
        var isLast = card.getAttribute('data-is-last') === 'true';
        var url = '/wishlists/' + wishlistId + '/items/' + itemId + '/card'
            + '?is_first=' + (isFirst ? 'true' : 'false')
            + '&is_last=' + (isLast ? 'true' : 'false');
        if (notice) { url += '&notice=' + notice; }
        fetch(url, { credentials: 'same-origin', headers: { 'Accept': 'text/html' } })
            .then(function (response) { return response.text(); })
            .then(function (markup) { swapWishCard(card, markup); });
    });
    </script>
</head>
<body class="bg-gray-50 text-gray-900"
      {% if viewer_identified|default(false) %}data-viewer-identified="true"{% endif %}>
    <main class="container mx-auto px-4 py-6 max-w-lg">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
