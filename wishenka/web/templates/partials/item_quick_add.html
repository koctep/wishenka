<div id="quick-add-bar" class="quick-add-container">
    <form id="quick-add-form"
          class="quick-add-form"
          hx-post="/web/wishlists/{{ wishlist.id }}/items/quick"
          hx-target="#items-list"
          hx-swap="beforeend">
        <div id="quick-add-preview-target" class="quick-add-preview-area"></div>
        <div class="quick-add-row flex items-center gap-2">
            <input type="text"
                   id="quick-add-input"
                   name="raw_input"
                   placeholder="{{ t('web.item.quick_add_placeholder', locale|default('en')) }}"
                   autocomplete="off"
                   hx-post="/web/wishlists/{{ wishlist.id }}/items/preview"
                   hx-trigger="input changed delay:500ms, paste"
                   hx-target="#quick-add-preview-target"
                   hx-swap="innerHTML" />
            <button type="button"
                    id="btn-quick-details"
                    class="btn-secondary text-sm"
                    hx-get="/web/wishlists/{{ wishlist.id }}/items/new"
                    hx-include="#quick-add-form"
                    hx-target="#item-modal-container"
                    hx-swap="innerHTML">
                {{ t('web.common.details', locale|default('en')) }}
            </button>
            <button type="submit"
                    id="btn-quick-add"
                    class="btn-primary text-sm font-semibold">
                {{ t('web.common.add', locale|default('en')) }}
            </button>
        </div>
    </form>
</div>
