<div class="modal-backdrop receipt-backdrop" id="item-receipt-modal" data-receipt-modal
     data-own-feedback
     {% if oob %}hx-swap-oob="outerHTML" {% endif %}role="dialog" aria-modal="true" aria-labelledby="receipt-title">
    <div class="modal-sheet receipt-sheet">
        <h2 id="receipt-title">{{ t('web.receipt.cancel_modal_title', locale|default('en')) }}</h2>
        {% if item_title %}<p class="receipt-wish">{{ item_title }}</p>{% endif %}
        <div id="receipt-feedback" class="receipt-feedback" role="alert" tabindex="-1">{{ feedback }}</div>
        {% if blocked %}
        <button type="button" class="btn-modal-close" data-modal-close>{{ t('web.common.close', locale|default('en')) }}</button>
        {% else %}
        <p class="receipt-final">{{ t('web.receipt.cancel_confirm_body', locale|default('en'), count=current_quantity, title=item_title) }}</p>
        <form data-receipt-form method="post"
              action="/web/wishlists/{{ wishlist_id }}/items/{{ item_id }}/receipts/{{ receipt_id }}/cancel">
            <button type="submit" class="btn-receipt-confirm">{{ t('web.receipt.cancel_confirm_btn', locale|default('en')) }}</button>
            <button type="button" class="btn-modal-close" data-modal-close>{{ t('web.common.cancel', locale|default('en')) }}</button>
        </form>
        {% endif %}
    </div>
</div>
