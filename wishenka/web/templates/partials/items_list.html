{% for item in items %}
    {% with is_first=loop.first, is_last=loop.last %}
        {% include "partials/item_card.html" %}
    {% endwith %}
{% else %}
    <p id="empty-items-placeholder" class="text-gray-500 text-center py-8">
        {{ t('web.wishlist.empty', locale|default('en')) }}
    </p>
{% endfor %}
